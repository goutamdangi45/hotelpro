version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: hotelpro_mongodb
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=hotelpro

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hotelpro_backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/hotelpro
      - JWT_SECRET=hotelpro_super_secret_jwt_key_2026_modern_secure_token
      - JWT_EXPIRE=30d
      - CLIENT_URL=http://localhost:3000
    depends_on:
      - mongodb

volumes:
  mongo_data:
